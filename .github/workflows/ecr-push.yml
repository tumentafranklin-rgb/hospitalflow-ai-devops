name: HospitalFlow AI - Build, Push and Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: us-east-1
  AWS_ACCOUNT_ID: "126309364316"
  EC2_INSTANCE_ID: i-0d89ac0f5a01fceac
  BACKEND_REPOSITORY: hospitalflow-ai-backend
  FRONTEND_REPOSITORY: hospitalflow-ai-frontend
  ECR_REGISTRY: 126309364316.dkr.ecr.us-east-1.amazonaws.com

jobs:
  build-and-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest

    outputs:
      image-tag: ${{ github.sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::126309364316:role/GitHubActions-HospitalFlow-ECR
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: HospitalFlowGitHubActions

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ env.ECR_REGISTRY }}/${{ env.BACKEND_REPOSITORY }}:${{ github.sha }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: ${{ env.ECR_REGISTRY }}/${{ env.FRONTEND_REPOSITORY }}:${{ github.sha }}

  deploy:
    name: Deploy to HospitalFlow EC2
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::126309364316:role/GitHubActions-HospitalFlow-ECR
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: HospitalFlowDeploy

      - name: Deploy through AWS Systems Manager
        env:
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image-tag }}
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          import os

          tag = os.environ["IMAGE_TAG"]
          registry = os.environ["ECR_REGISTRY"]

          commands = [
              "set -eu",
              f"aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin {registry}",
              "docker network inspect hospitalflow-ai-network >/dev/null",
              f"docker pull {registry}/hospitalflow-ai-backend:{tag}",
              f"docker pull {registry}/hospitalflow-ai-frontend:{tag}",
              "docker inspect hospitalflow-ai-backend >/dev/null",
              "docker inspect hospitalflow-ai-frontend >/dev/null",
              "OLD_BACKEND=$(docker inspect -f '{{.Config.Image}}' hospitalflow-ai-backend)",
              "OLD_FRONTEND=$(docker inspect -f '{{.Config.Image}}' hospitalflow-ai-frontend)",
              "docker stop hospitalflow-ai-frontend",
              "docker rm hospitalflow-ai-frontend",
              "docker stop hospitalflow-ai-backend",
              "docker rm hospitalflow-ai-backend",
              f"docker run -d --name hospitalflow-ai-backend --network hospitalflow-ai-network --network-alias backend -p 127.0.0.1:8000:8000 --restart unless-stopped {registry}/hospitalflow-ai-backend:{tag}",
              f"docker run -d --name hospitalflow-ai-frontend --network hospitalflow-ai-network --network-alias frontend -p 8081:80 --restart unless-stopped {registry}/hospitalflow-ai-frontend:{tag}",
              "sleep 10",
              "docker inspect -f '{{.State.Running}}' hospitalflow-ai-backend | grep -qx true",
              "docker inspect -f '{{.State.Running}}' hospitalflow-ai-frontend | grep -qx true",
              "curl --fail --silent --show-error http://127.0.0.1:8000/health",
              "curl --fail --silent --show-error http://127.0.0.1:8081/api/health",
              "echo 'HospitalFlow AI deployment succeeded.'"
          ]

          with open("deploy-parameters.json", "w") as f:
              json.dump({"commands": commands}, f)
          PY

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${EC2_INSTANCE_ID}" \
            --document-name "AWS-RunShellScript" \
            --parameters file://deploy-parameters.json \
            --timeout-seconds 600 \
            --comment "Deploy HospitalFlow AI commit ${IMAGE_TAG}" \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM Command ID: ${COMMAND_ID}"

          for attempt in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "${COMMAND_ID}" \
              --instance-id "${EC2_INSTANCE_ID}" \
              --query 'Status' \
              --output text 2>/dev/null || true)

            echo "Deployment status: ${STATUS}"

            case "${STATUS}" in
              Success)
                echo "Deployment and health checks succeeded."
                exit 0
                ;;
              Failed|Cancelled|TimedOut)
                aws ssm get-command-invocation \
                  --command-id "${COMMAND_ID}" \
                  --instance-id "${EC2_INSTANCE_ID}" \
                  --output json || true
                exit 1
                ;;
            esac

            sleep 10
          done

          echo "Timed out waiting for deployment."
          exit 1
