name: HospitalFlow AI - Build and Push to ECR

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: us-east-1
  AWS_ACCOUNT_ID: "126309364316"
  BACKEND_REPOSITORY: hospitalflow-ai-backend
  FRONTEND_REPOSITORY: hospitalflow-ai-frontend

jobs:
  build-and-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Inspect GitHub OIDC claims
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken("sts.amazonaws.com");
            const payload = JSON.parse(
              Buffer.from(token.split(".")[1], "base64url").toString()
            );

            console.log("OIDC audience:", payload.aud);
            console.log("OIDC subject:", payload.sub);

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::126309364316:role/GitHubActions-HospitalFlow-ECR
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: HospitalFlowGitHubActions

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            126309364316.dkr.ecr.us-east-1.amazonaws.com/hospitalflow-ai-backend:${{ github.sha }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            126309364316.dkr.ecr.us-east-1.amazonaws.com/hospitalflow-ai-frontend:${{ github.sha }}
