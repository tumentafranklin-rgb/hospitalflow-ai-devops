name: HospitalFlow AI - Build and Push to ECR

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: us-east-1
  AWS_ACCOUNT_ID: "126309364316"
  BACKEND_REPOSITORY: hospitalflow-ai-backend
  FRONTEND_REPOSITORY: hospitalflow-ai-frontend

jobs:
  build-and-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::126309364316:role/GitHubActions-HospitalFlow-ECR
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            126309364316.dkr.ecr.us-east-1.amazonaws.com/hospitalflow-ai-backend:${{ github.sha }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            126309364316.dkr.ecr.us-east-1.amazonaws.com/hospitalflow-ai-frontend:${{ github.sha }}
